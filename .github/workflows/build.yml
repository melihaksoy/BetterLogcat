# Builds, tests and verifies every push to main and every pull request. The plugin zip is kept as a
# workflow artifact, so a change can be tried before it is released.
name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Caches Gradle and the downloaded Android Studio between runs.
      - uses: gradle/actions/setup-gradle@v4

      # No local Studio here: Gradle downloads Android Studio `platformVersion` from gradle.properties.
      - name: Test and build
        run: ./gradlew test buildPlugin

      - name: Verify against Android Studio
        run: ./gradlew verifyPlugin -PverifyAndroidStudioVersions="$(grep '^platformVersion=' gradle.properties | cut -d= -f2)"

      - uses: actions/upload-artifact@v4
        with:
          name: better-logcat-zip
          path: build/distributions/*.zip
          if-no-files-found: error
