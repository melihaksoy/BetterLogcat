# One-line descriptions of common Android log tags, shown as a tooltip on the tag.
# Key: the exact tag. Value: what writes it, and a hint when it is usually noise.
# Users can add or replace a description with right-click > Edit description in the Tags panel.

# App crashes and runtime
AndroidRuntime=Android runtime: Java/Kotlin crashes ("FATAL EXCEPTION") and app process start-up.
DEBUG=Native crash report (tombstone) from the crash dumper: signal, registers and native stack.
libc=C library: native warnings, file descriptor errors (fdsan) and native crash signals.
linker=Dynamic linker: loads native libraries (.so) into the process.
nativeloader=Loads native libraries for the app and checks which ones it may use.
art=Android Runtime (ART): garbage collection, JIT compiler and class loading.
artd=ART service daemon: compiles apps (dexopt) in the background. Usually safe to hide.
dex2oat=Compiles app bytecode (DEX) to native code at install or in the background. Usually safe to hide.
Zygote=Zygote: the process that starts every app process.
StrictMode=StrictMode: policy violations, such as disk or network access on the main thread.
CompatibilityChangeReporter=Reports platform behavior changes that apply to the app (target SDK changes). Usually safe to hide.
System.out=Text printed with println() or System.out.
System.err=Text printed to System.err, for example printStackTrace().
Looper=Looper: warnings about slow message dispatch on a thread.
JavaBinder=Binder IPC from Java: failed transactions, often a too large parcel.

# Activities, windows and input
ActivityManager=Activity Manager: starts, stops and kills app processes and services.
ActivityTaskManager=Activity Task Manager: activity starts, tasks and the back stack, launch times.
WindowManager=Window Manager: windows, focus and screen layout.
ViewRootImpl=Connects a window's views to the system: layout, drawing and input for one window.
InputDispatcher=Delivers touch and key events to windows. Logs "input dispatching timed out" ANRs.
InputReader=Reads input devices such as the touch screen and keyboards.
InputMethodManager=Keyboard (IME) connection of the app.
IInputConnectionWrapper=Keyboard (IME) connection calls on a closed connection. Usually safe to hide.
ImeTracker=Tracks requests to show and hide the keyboard. Usually safe to hide.
InsetsController=System bar and keyboard insets, and their animations. Usually safe to hide.
WindowOnBackDispatcher=Back gesture callbacks, including predictive back.
AutofillManager=Autofill framework: fills login and form fields.
AssistStructure=Builds the view structure for autofill and assistants. Usually safe to hide.
PackageManager=Package Manager: app installs, components and permissions.
AppOps=App ops: checks of special permissions and operations.

# Drawing and frames
Choreographer=Frame timing. "Skipped N frames" means the main thread was too busy.
OpenGLRenderer=Hardware UI renderer (HWUI): draws the app's views with the GPU.
skia=Skia: the 2D graphics library behind the UI renderer.
Skia=Skia: the 2D graphics library behind the UI renderer.
SurfaceFlinger=Combines all app windows into the final screen image.
BLASTBufferQueue=Passes drawn frames from the app to SurfaceFlinger. Usually safe to hide.
GraphicsEnvironment=Chooses the graphics driver for the app. Usually safe to hide.
EGL_emulation=Emulator OpenGL ES layer. Usually safe to hide.
HostConnection=Emulator connection to the host GPU. Usually safe to hide.

# Network and connectivity
ConnectivityManager=Network state and network requests of the app.
NetworkSecurityConfig=The app's network security config: cleartext traffic and trusted certificates.
TrafficStats=Socket tagging for data usage stats. Usually safe to hide.
OkHttp=OkHttp HTTP client, usually its logging interceptor.
chromium=WebView (Chromium) messages.
WebViewFactory=Loads the WebView implementation.
wpa_supplicant=Wi-Fi connection and authentication.

# Telephony, location and media
RILJ=Radio interface layer: calls, SMS and mobile data.
Telephony=Telephony framework: phone state, SIM and mobile network.
LocationManager=Location requests and providers.
AudioTrack=Audio playback stream of an app.
AudioFlinger=System audio mixer.
MediaCodec=Hardware and software audio and video codecs.

# System services and daemons
PowerManagerService=Wake locks, screen on and off, and sleep.
AlarmManager=Alarms that wake the app at set times.
JobScheduler=Background job scheduling.
chatty=Log daemon note: it dropped repeated lines from a busy app.
logd=Log daemon: stores the log buffers that logcat reads.
adbd=adb daemon on the device: the connection to your computer.
init=init: the first process; starts and restarts system services.
vold=Storage daemon: mounts and encrypts storage.
keystore2=Keystore: secure storage for cryptographic keys.
ziparchive=Reads APK and zip files. "Unable to open" is often harmless. Usually safe to hide.
ProfileInstaller=Installs baseline profiles that make app start-up faster.

# Google Play services and Firebase
GoogleApiManager=Google Play services client connections.
DynamiteModule=Loads code modules from Google Play services.
ProviderInstaller=Updates the security provider through Google Play services.
Finsky=Google Play Store app.
FA=Google Analytics for Firebase.
FA-SVC=Google Analytics for Firebase, inside Google Play services.
FirebaseApp=Firebase start-up in the app.
FirebaseCrashlytics=Firebase Crashlytics crash reporting.

# Common libraries
LeakCanary=LeakCanary: finds memory leaks in debug builds.
Glide=Glide image loading library.
