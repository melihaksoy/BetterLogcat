kotlin.code.style=official
kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
# Off: a cached test compile once hid a real compile error after a model change.
org.gradle.caching=false
org.gradle.jvmargs=-Xmx3g

pluginGroup=com.melihaksoy.betterlogcat
pluginVersion=0.12.1

# Lowest Android Studio build the plugin supports: 2026.2.1 (262.9437).
# Compile against this build. Newer builds add Jewel overloads that older builds lack.
pluginSinceBuild=262.9437

# Android Studio release used to compile and run the plugin.
platformVersion=2026.2.1.8
# Optional: path to a local Android Studio install. Overrides platformVersion when set.
# Put it in ~/.gradle/gradle.properties or pass -PlocalPlatformPath=... to keep it out of the repo.
localPlatformPath=
